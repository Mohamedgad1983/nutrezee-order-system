name: kds-ci

on:
  push:
    branches: ["main", "build/wp-kds-**"]
    paths:
      - "kitchen-display/**"
      - ".github/workflows/kds-ci.yml"
  pull_request:
    paths:
      - "kitchen-display/**"
      - ".github/workflows/kds-ci.yml"

defaults:
  run:
    working-directory: kitchen-display

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22.12.0, cache: npm, cache-dependency-path: kitchen-display/package-lock.json }
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22.12.0, cache: npm, cache-dependency-path: kitchen-display/package-lock.json }
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22.12.0, cache: npm, cache-dependency-path: kitchen-display/package-lock.json }
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22.12.0, cache: npm, cache-dependency-path: kitchen-display/package-lock.json }
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22.12.0, cache: npm, cache-dependency-path: kitchen-display/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  container:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker compose -f kitchen-display/compose.yml config --quiet
      - name: validate protected-file staging compose
        run: KDS_PUBLIC_ORIGIN=https://kds.example.com docker compose -f kitchen-display/compose.staging.yml config --quiet
      - run: docker build -f kitchen-display/Dockerfile -t nutrezee-kds:ci kitchen-display
      - name: verify runtime ESM entrypoint loads
        run: docker run --rm nutrezee-kds:ci node -e "import('./dist/api/api/server.js')"
      - name: smoke-test hardened runtime health
        run: |
          set -euo pipefail
          container=nutrezee-kds-ci-smoke
          secret_dir="$(mktemp -d)"
          secret_gid=61001
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            sudo rm -rf "$secret_dir"
          }
          trap cleanup EXIT
          sudo chown root:"$secret_gid" "$secret_dir"
          sudo chmod 0750 "$secret_dir"
          printf '%s\n' 'ci-only-read-key' | sudo tee "$secret_dir/kds_partner_api_key" >/dev/null
          printf '%s\n' 'scrypt$16384$8$1$EEaR1Y_Xj3T_xGDtvGqE9w$7z8ViKE6efG7ctOyMbCNesWDJOguFn2uLbI5IeTIQ4Q' \
            | sudo tee "$secret_dir/kds_display_password_hash" >/dev/null
          sudo chown root:"$secret_gid" "$secret_dir"/*
          sudo chmod 0640 "$secret_dir"/*
          docker run --detach --name "$container" --network none --read-only \
            --tmpfs /tmp:size=16m,mode=1777 --cap-drop ALL --security-opt no-new-privileges:true \
            --group-add "$secret_gid" --volume "$secret_dir:/run/secrets:ro" \
            -e NODE_ENV=production \
            -e KDS_PUBLIC_ORIGIN=https://kds.example.com \
            -e KDS_COOKIE_SECURE=true \
            -e KDS_PARTNER_API_BASE=https://nutreeze.com/integration \
            -e KDS_PARTNER_API_KEY_FILE=/run/secrets/kds_partner_api_key \
            -e KDS_DISPLAY_USERNAME=ci-display \
            -e KDS_DISPLAY_PASSWORD_HASH_FILE=/run/secrets/kds_display_password_hash \
            -e KDS_KITCHENS=main \
            nutrezee-kds:ci
          for attempt in {1..20}; do
            if docker exec "$container" node -e \
              "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"; then
              test "$(docker exec "$container" id -u)" = "1000"
              test "$(docker exec "$container" stat -c '%a:%u:%g' /run/secrets/kds_partner_api_key)" = "640:0:${secret_gid}"
              exit 0
            fi
            sleep 1
          done
          docker logs "$container"
          exit 1
