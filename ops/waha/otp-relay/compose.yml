# WP-OPS-A73 — internal relay for driver login codes (Fleetbase → WAHA). No host ports.
name: waha-otp-relay
services:
  relay:
    image: python@sha256:2dd78ad5cf13a0b68f5134dc49aa9950203a8cf4b7463431b9f3b398287c5059
    container_name: waha-otp-relay
    restart: unless-stopped
    init: true
    user: '10001:10001'
    command: ['python', '/app/relay.py']
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs: ['/tmp:size=8m,mode=1777']
    environment:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      WAHA_URL: http://waha-api:3000
      WAHA_SESSION: nutreeze
      WAHA_API_KEY: ${WAHA_API_KEY_PLAIN:?WAHA key missing}
      RELAY_TOKEN: ${RELAY_TOKEN:?relay token missing}
      RELAY_HOURLY_LIMIT: '40'
    volumes:
      - ./relay.py:/app/relay.py:ro
    networks: [nutrezee_default]
    mem_limit: 96m
    cpus: 0.5
    pids_limit: 48
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: '2'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
networks:
  nutrezee_default:
    external: true
