server {
    listen       4200;
    server_name  localhost;
    root         /usr/share/nginx/html;

    # A45: the previous development image transferred roughly 40 MB without compression.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Shell HTML must revalidate, but must never erase the origin cache. Fingerprinted assets below
    # carry their own immutable lifetime, so a new index automatically selects a new release.
    location = / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ @spa_fallback;
    }

    location @spa_fallback {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    # Runtime configuration and extension discovery must remain current without clearing unrelated
    # browser cache, cookies or local storage.
    location = /fleetbase.config.json {
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /fleetbase.config.json @config_fallback;
    }

    location = /extensions.json {
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /extensions.json =404;
    }

    # Stable aliases revalidate by ETag. This includes the extension-owned direct-route theme alias.
    location = /assets/vendor.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /assets/vendor.js =404;
    }

    location = /assets/@fleetbase/console.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /assets/@fleetbase/console.js =404;
    }

    location = /engines-dist/@nutrezee/fleetops-labels-engine/assets/engine.css {
        default_type text/css;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /engines-dist/@nutrezee/fleetops-labels-engine/assets/engine.css =404;
    }

    # Ember production assets contain a content hash. They are safe to retain for one year because
    # any content change creates a new URL selected by the revalidated index/engine manifest.
    location ~* "^/(assets|engines-dist)/.+[-.][0-9a-f]{16,}\\.(css|js|map|png|jpg|jpeg|gif|svg|woff|woff2)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location @config_fallback {
        return 200 '{}';
    }
}
